# Publica el programa de avisos (carpeta notificaciones/) en Cloudflare Workers.
# Se ejecuta cuando cambia esa carpeta, o a mano desde la pestaña "Actions".
# Necesita dos secretos en GitHub: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
# Para la IA, además: GEMINI_API_KEY y EMAIL_PERMITIDO (se copian como secretos a Cloudflare).

name: Publicar los avisos

on:
  push:
    branches: [main]
    paths: ['notificaciones/**', '.github/workflows/avisos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMAIL_PERMITIDO: ${{ secrets.EMAIL_PERMITIDO }}
    defaults:
      run:
        working-directory: notificaciones
    steps:
      - uses: actions/checkout@v4
      - name: Revisar que estén los secretos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Faltan los secretos CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID en Settings → Secrets and variables → Actions. No se publica nada."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notificaciones/package-lock.json
      - run: npm ci
      - name: Publicar en Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
      - name: Cargar los secretos de la IA en Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.GEMINI_API_KEY != '' && env.EMAIL_PERMITIDO != ''
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          printf '%s' "$EMAIL_PERMITIDO" | npx wrangler secret put EMAIL_PERMITIDO
