# Publicación automática en GitHub Pages.
# Cada vez que subís cambios a la rama "main", GitHub arma la app
# (npm ci + npm run build) y publica la carpeta dist/ en internet.

name: Publicar la app

on:
  push:
    branches: [main]
  workflow_dispatch: # también se puede lanzar a mano desde la pestaña "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
