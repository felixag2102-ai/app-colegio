<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ideas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes aiSpin{to{transform:rotate(360deg)}}
@keyframes aiPop{from{opacity:0;transform:scale(0.1)}to{opacity:1;transform:none}}
@keyframes aiFade{from{opacity:0}to{opacity:1}}
@keyframes aiMsg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes aiDot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
@keyframes aiTwinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.14) rotate(14deg)}}
@keyframes edUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes edIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{-webkit-font-smoothing:antialiased}
@keyframes clkPop{from{opacity:0;transform:scale(0.86)}to{opacity:1;transform:none}}
@keyframes clkA{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:none}}
@keyframes clkB{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:none}}
@keyframes exFade{to{opacity:0}}
@keyframes navIn{from{scale:0.5;opacity:0}to{scale:1;opacity:1}}
@keyframes exPop{to{opacity:0;transform:scale(0.86)}}
@keyframes exSlide{to{opacity:0;transform:translateY(24px)}}
@keyframes exUp{to{opacity:0;transform:translateY(-6px)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-14px)}}
a{color:#1A3596}a:hover{color:#10246B}
button,input{font-family:inherit}
button:active{transform:scale(0.97)}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-360px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
</style>
</helmet>
<div style="width: 360px; height: 780px; box-sizing: border-box; background: #EEF0F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', system-ui, sans-serif; color: #15171C; display: flex; flex-direction: column; position: relative; overflow: hidden">

<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
<div style="position: absolute; width: 260px; height: 260px; left: -80px; top: 140px; border-radius: 50%; background: #8A4DE8; opacity: 0.26; filter: blur(70px)"></div>
<div style="position: absolute; width: 240px; height: 240px; right: -90px; top: 500px; border-radius: 50%; background: #E0567A; opacity: 0.26; filter: blur(70px)"></div>
<svg width="720" height="780" viewBox="0 0 720 780" style="position: absolute; left: 0; top: 0; filter: blur(1.1px); animation: drift 70s linear infinite">
<path d="{{ waveA }}" fill="none" stroke="#15171C" stroke-width="1.1" stroke-opacity="0.5"><animate attributeName="d" dur="18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" values="{{ waveAValues }}"></animate></path>
<path d="{{ waveB }}" fill="none" stroke="#15171C" stroke-width="1.1" stroke-opacity="0.42"><animate attributeName="d" dur="22s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" values="{{ waveBValues }}"></animate></path>
</svg>
<div style="position: absolute; inset: 0; background: rgba(238,240,247,0.30); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px)"></div>
</div>

<div style="position: relative; padding: 44px 16px 0 16px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1; min-height: 0">

<div style="display: flex; justify-content: space-between; align-items: flex-end; animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) both">
<div style="display: flex; flex-direction: column; gap: 3px">
<p style="margin: 0; font-size: 13px; font-weight: 600; color: #3B404B">{{ doneText }}</p>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Ideas</h1>
</div>
<button onClick="{{ ed.openFn }}" aria-label="Editar nombres y colores de las categorías" style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.78); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 8px 20px rgba(30,40,80,0.12); color: #15171C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg></button>
</div>

<div style="display: flex; gap: 8px; padding: 5px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.84); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 10px 26px rgba(30,40,80,0.10); animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) 0.06s both">
<input type="text" ref="{{ inputRef }}" aria-label="Nueva idea" value="{{ draft }}" onChange="{{ setDraft }}" onKeyDown="{{ onKey }}" placeholder="Anotá una idea…" style="flex-grow: 1; min-width: 0; min-height: 44px; border: none; background: transparent; padding: 0 10px; font-size: 16px; font-weight: 500; color: #15171C; outline: none">
<button onClick="{{ add }}" aria-label="Agregar idea" style="width: 44px; height: 44px; border-radius: 16px; border: none; background: #15171C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: opacity 0.2s; {{ addStyle }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>

<div role="group" aria-label="Filtrar por categoría" style="display: flex; flex-wrap: wrap; gap: 6px; animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) 0.1s both">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
<button onClick="{{ f.pick }}" aria-pressed="{{ f.sel }}" style="min-height: 36px; padding: 0 14px; border-radius: 18px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; transition: background 0.25s, color 0.25s; {{ f.style }}"><span style="width: 8px; height: 8px; border-radius: 4px; transition: background 0.3s; {{ f.dot }}"></span>{{ f.name }}</button>
</sc-for>
</div>

<div style="flex: 0 1 auto; min-height: 0; overflow-y: auto; margin-bottom: 4px; border-radius: 24px; padding: 2px 12px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.84); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 12px 28px rgba(30,40,80,0.10); animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) 0.14s both">
<sc-for list="{{ list }}" as="it" hint-placeholder-count="6">
<div style="position: relative; overflow: hidden; {{ it.rowStyle }}">
<div aria-hidden="true" style="position: absolute; top: 5px; bottom: 5px; right: 0; border-radius: 14px; background: #D93A2B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; overflow: hidden; white-space: nowrap; font-size: 13px; font-weight: 600; {{ it.sw.bg }}"><sc-if value="{{ it.sw.label }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg>Eliminar</sc-if></div>
<div onPointerDown="{{ it.sw.down }}" onPointerMove="{{ it.sw.move }}" onPointerUp="{{ it.sw.up }}" onPointerCancel="{{ it.sw.up }}" style="position: relative; display: flex; align-items: center; gap: 10px; touch-action: pan-y; {{ it.sw.fg }}">
<button role="checkbox" aria-checked="{{ it.done }}" onClick="{{ it.toggle }}" style="flex-grow: 1; min-width: 0; min-height: 48px; padding: 9px 0; border: none; background: transparent; display: flex; gap: 11px; align-items: center; cursor: pointer; text-align: left; color: inherit">
<span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 8px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; transition: background 0.25s, border-color 0.25s, box-shadow 0.25s; {{ it.boxStyle }}">
<sc-if value="{{ it.done }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: pop 0.3s ease-out"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</span>
<span style="flex-grow: 1; min-width: 0; font-size: 15px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; transition: color 0.25s; {{ it.textStyle }}"><span style="background-image: linear-gradient(currentColor, currentColor); background-repeat: no-repeat; background-position: 0 58%; transition: background-size 0.4s cubic-bezier(.22,1,.36,1); {{ it.strike }}">{{ it.t }}</span></span>
</button>
<span role="img" aria-label="{{ it.c }}" style="width: 9px; height: 9px; border-radius: 5px; flex-shrink: 0; transition: background 0.3s; background: {{ it.color }}"></span>
<sc-if value="{{ it.done }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Deslizá a la izquierda para eliminar" style="flex-shrink: 0; color: #8E93A0; display: flex"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"></path></svg></span></sc-if>
</div>
</div>
</sc-for>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<div style="padding: 18px 4px; text-align: center; font-size: 14px; font-weight: 600; color: #3B404B">Todavía no hay ideas acá</div>
</sc-if>
</div>

</div>

<nav ref="{{ nav.ref }}" aria-label="Secciones" onPointerDown="{{ nav.down }}" onPointerMove="{{ nav.move }}" onPointerUp="{{ nav.up }}" onPointerCancel="{{ nav.cancel }}" style="position: relative; margin: 12px 14px 20px 14px; border-radius: 32px; padding: 7px; display: flex; justify-content: space-between; touch-action: none; user-select: none; -webkit-user-select: none; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.72); backdrop-filter: blur(30px) saturate(170%); -webkit-backdrop-filter: blur(30px) saturate(170%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), inset 0 -1px 1px rgba(255,255,255,0.35), 0 14px 34px rgba(30,40,80,0.16)">
<span aria-hidden="true" style="position: absolute; z-index: 0; top: 7px; bottom: 7px; left: 7px; width: calc((100% - 14px) / 5); border-radius: 25px; box-shadow: inset 0 1px 1px rgba(255,255,255,0.25), 0 6px 16px rgba(21,23,28,0.3); pointer-events: none; {{ nav.pill }}"></span>
<button onClick="{{ nav.go0 }}" style="position: relative; z-index: 1; flex: 1 1 0; min-height: 56px; border-radius: 25px; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color 0.3s; {{ nav.s0 }}">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transition: transform 0.4s cubic-bezier(.34,1.45,.64,1); {{ nav.i0 }}"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</button>
<button onClick="{{ nav.go1 }}" style="position: relative; z-index: 1; flex: 1 1 0; min-height: 56px; border-radius: 25px; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color 0.3s; {{ nav.s1 }}">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transition: transform 0.4s cubic-bezier(.34,1.45,.64,1); {{ nav.i1 }}"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Agenda</button>
<button onClick="{{ nav.go2 }}" style="position: relative; z-index: 1; flex: 1 1 0; min-height: 56px; border-radius: 25px; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color 0.3s; {{ nav.s2 }}">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transition: transform 0.4s cubic-bezier(.34,1.45,.64,1); {{ nav.i2 }}"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Boletín</button>
<button onClick="{{ nav.go3 }}" style="position: relative; z-index: 1; flex: 1 1 0; min-height: 56px; border-radius: 25px; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color 0.3s; {{ nav.s3 }}">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transition: transform 0.4s cubic-bezier(.34,1.45,.64,1); {{ nav.i3 }}"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Apuntes</button>
<button onClick="{{ nav.go4 }}" aria-current="page" style="position: relative; z-index: 1; flex: 1 1 0; min-height: 56px; border-radius: 25px; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color 0.3s; {{ nav.s4 }}">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transition: transform 0.4s cubic-bezier(.34,1.45,.64,1); {{ nav.i4 }}"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>Ideas</button>
<a href="Main.dc.html" tabindex="-1" aria-hidden="true" style="display: none"></a>
<a href="Agenda.dc.html" tabindex="-1" aria-hidden="true" style="display: none"></a>
<a href="Notas.dc.html" tabindex="-1" aria-hidden="true" style="display: none"></a>
<a href="Apuntes.dc.html" tabindex="-1" aria-hidden="true" style="display: none"></a>
<a href="Ideas.dc.html" tabindex="-1" aria-hidden="true" style="display: none"></a>
</nav>


<sc-if value="{{ ed.open }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 90; animation: aiFade 0.2s ease-out both">
<button onClick="{{ ed.close }}" aria-label="Guardar y cerrar" style="position: absolute; inset: 0; width: 100%; height: 100%; border: none; padding: 0; background: rgba(15,17,22,0.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: default; {{ ed.back }}"></button>
<div role="dialog" aria-label="{{ ed.title }}" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 680px; box-sizing: border-box; padding: 0 16px 22px 16px; border-radius: 32px 32px 0 0; background: rgba(255,255,255,0.97); backdrop-filter: blur(30px) saturate(170%); -webkit-backdrop-filter: blur(30px) saturate(170%); box-shadow: 0 -20px 50px rgba(20,24,40,0.25); display: flex; flex-direction: column; gap: 8px; animation: edUp 0.4s cubic-bezier(.22,1,.36,1) backwards; {{ ed.sheetStyle }}">
<div onPointerDown="{{ ed.sdDown }}" onPointerMove="{{ ed.sdMove }}" onPointerUp="{{ ed.sdUp }}" onPointerCancel="{{ ed.sdUp }}" style="display: flex; flex-direction: column; gap: 10px; padding: 10px 0 4px 0; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: rgba(21,23,28,0.22)"></span>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<h2 style="margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em">{{ ed.title }}</h2>
<button onClick="{{ ed.close }}" style="min-height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: #15171C; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Listo</button>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 500; color: #3B404B; line-height: 1.4">{{ ed.note }}</p>
</div>
<div style="flex: 0 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; margin: 0 -8px; padding: 0 8px">
<sc-for list="{{ ed.items }}" as="ei" hint-placeholder-count="5">
<div style="border-bottom: 1px solid rgba(21,23,28,0.07); {{ ei.rowStyle }}">
<sc-if value="{{ ei.normal }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 8px; min-height: 58px">
<button onClick="{{ ei.pal }}" aria-label="{{ ei.aria }}" aria-expanded="{{ ei.palOpen }}" style="width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; border: none; padding: 0; cursor: pointer; transition: box-shadow 0.2s, background 0.3s; background: {{ ei.color }}; {{ ei.ring }} {{ ei.colorStyle }}"></button>
<input type="text" value="{{ ei.name }}" readOnly="{{ ei.locked }}" onChange="{{ ei.rename }}" aria-label="Nombre" style="flex-grow: 1; min-width: 0; min-height: 44px; border-radius: 14px; border: 1.5px solid rgba(21,23,28,0.12); background: #F7F8FA; padding: 0 12px; font-size: 15px; font-weight: 600; color: #15171C; outline-color: #15171C; {{ ei.inputStyle }}">
<sc-if value="{{ ed.reorder }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ ei.up }}" aria-label="{{ ei.upLabel }}" style="width: 34px; height: 40px; flex-shrink: 0; border-radius: 12px; border: none; background: rgba(21,23,28,0.06); color: #15171C; display: flex; align-items: center; justify-content: center; cursor: pointer; {{ ei.upStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<button onClick="{{ ei.down }}" aria-label="{{ ei.downLabel }}" style="width: 34px; height: 40px; flex-shrink: 0; border-radius: 12px; border: none; background: rgba(21,23,28,0.06); color: #15171C; display: flex; align-items: center; justify-content: center; cursor: pointer; {{ ei.downStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</sc-if>
<sc-if value="{{ ei.canDel }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ ei.askDel }}" aria-label="{{ ei.delLabel }}" style="width: 36px; height: 40px; flex-shrink: 0; border-radius: 12px; border: none; background: rgba(179,38,30,0.08); color: #B3261E; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg></button>
</sc-if>
<sc-if value="{{ ei.locked }}" hint-placeholder-val="{{ false }}">
<span role="img" aria-label="Fija, no se puede borrar" style="width: 36px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #4A4F5A"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
</sc-if>
</div>
<sc-if value="{{ ei.palOpen }}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Colores" style="display: flex; gap: 6px; padding: 6px 6px 14px 50px; animation: edIn 0.25s ease-out both">
<sc-for list="{{ ei.swatches }}" as="sw" hint-placeholder-count="8">
<button onClick="{{ sw.pick }}" aria-label="{{ sw.label }}" aria-pressed="{{ sw.sel }}" style="width: 28px; height: 28px; border-radius: 10px; flex-shrink: 0; border: none; padding: 0; cursor: pointer; transition: box-shadow 0.2s; background: {{ sw.color }}; {{ sw.ring }}"></button>
</sc-for>
</div>
</sc-if>
</sc-if>
<sc-if value="{{ ei.confirming }}" hint-placeholder-val="{{ false }}">
<div role="alertdialog" aria-label="{{ ei.confirmText }}" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; margin: 8px 0; border-radius: 16px; background: rgba(179,38,30,0.07); animation: edIn 0.25s ease-out both">
<span style="font-size: 15px; font-weight: 700; color: #15171C">{{ ei.confirmText }}</span>
