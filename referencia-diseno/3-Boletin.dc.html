<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Boletín</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes aiSpin{to{transform:rotate(360deg)}}
@keyframes aiPop{from{opacity:0;transform:scale(0.1)}to{opacity:1;transform:none}}
@keyframes aiFade{from{opacity:0}to{opacity:1}}
@keyframes aiMsg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes aiDot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
@keyframes aiTwinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.14) rotate(14deg)}}
@keyframes edUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes edIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{-webkit-font-smoothing:antialiased}
@keyframes clkPop{from{opacity:0;transform:scale(0.86)}to{opacity:1;transform:none}}
@keyframes clkA{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:none}}
@keyframes clkB{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:none}}
@keyframes exFade{to{opacity:0}}
@keyframes navIn{from{scale:0.5;opacity:0}to{scale:1;opacity:1}}
@keyframes exPop{to{opacity:0;transform:scale(0.86)}}
@keyframes exSlide{to{opacity:0;transform:translateY(24px)}}
@keyframes exUp{to{opacity:0;transform:translateY(-6px)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-14px)}}
a{color:#1A3596}a:hover{color:#10246B}
button,select,input{font-family:inherit}
button:active{transform:scale(0.96)}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-360px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes expand{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes bumpA{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes bumpB{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
</style>
</helmet>
<div style="width: 360px; height: 780px; box-sizing: border-box; background: #EEF0F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', system-ui, sans-serif; color: #15171C; display: flex; flex-direction: column; position: relative; overflow: hidden">

<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
<div style="position: absolute; width: 260px; height: 260px; right: -90px; top: 120px; border-radius: 50%; background: #FF9A5C; opacity: 0.30; filter: blur(70px)"></div>
<div style="position: absolute; width: 240px; height: 240px; left: -90px; top: 500px; border-radius: 50%; background: {{accent}}; opacity: 0.30; filter: blur(70px)"></div>
<svg width="720" height="780" viewBox="0 0 720 780" style="position: absolute; left: 0; top: 0; filter: blur(1.1px); animation: drift 70s linear infinite">
<path d="{{ waveA }}" fill="none" stroke="#15171C" stroke-width="1.1" stroke-opacity="0.5"><animate attributeName="d" dur="18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" values="{{ waveAValues }}"></animate></path>
<path d="{{ waveB }}" fill="none" stroke="#15171C" stroke-width="1.1" stroke-opacity="0.42"><animate attributeName="d" dur="22s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" values="{{ waveBValues }}"></animate></path>
</svg>
<div style="position: absolute; inset: 0; background: rgba(238,240,247,0.30); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px)"></div>
</div>

<div style="position: relative; padding: 44px 16px 0 16px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1; min-height: 0">

<div style="display: flex; justify-content: space-between; align-items: flex-end; animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) both">
<div style="display: flex; flex-direction: column; gap: 3px">
<p style="margin: 0; font-size: 13px; font-weight: 600; color: #3B404B">3er año · 3er trimestre</p>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Boletín</h1>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<button onClick="{{ ed.openFn }}" aria-label="Editar nombres y colores de las materias" style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.78); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 8px 20px rgba(30,40,80,0.12); color: #15171C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg></button>
<button onClick="{{ openAdd }}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: #15171C; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; box-shadow: 0 8px 20px rgba(21,23,28,0.28)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Cargar nota</button>
</div>
</div>

<div style="border-radius: 28px; padding: 18px; color: #FFFFFF; background: rgba(22,24,32,0.86); border: 1px solid rgba(255,255,255,0.16); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.22), 0 16px 36px rgba(20,24,40,0.26); display: flex; align-items: center; gap: 16px; animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) 0.06s both">
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #C9CCD4">PROMEDIO GENERAL</span>
<span style="font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; {{ bump }}">{{ general }}</span>
<span style="font-size: 13px; font-weight: 500; color: #D5D8DF">{{ totalText }}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end; min-width: 0">
<span style="font-size: 12px; font-weight: 600; color: #C9CCD4">Mejor materia</span>
<span style="font-size: 14px; font-weight: 700; background: rgba(255,255,255,0.14); padding: 6px 12px; border-radius: 999px; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis">{{ best }}</span>
</div>
</div>

<div style="flex: 0 1 auto; min-height: 0; overflow-y: auto; margin-bottom: 4px; border-radius: 28px; padding: 6px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.84); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 16px 36px rgba(30,40,80,0.12); animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) 0.12s both">
<sc-for list="{{ subjects }}" as="m" hint-placeholder-count="6">
<div style="border-radius: 22px; transition: background 0.3s; {{ m.wrapStyle }}">
<button onClick="{{ m.toggle }}" aria-expanded="{{ m.open }}" style="width: 100%; min-height: 56px; border: none; background: transparent; border-radius: 22px; padding: 0 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #15171C; text-align: left">
<span style="width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #FFFFFF; transition: background 0.3s; background: {{ m.color }}">{{ m.initial }}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.name }}</span><span style="font-size: 12px; font-weight: 500; color: #3B404B">{{ m.countText }}</span></span>
<span style="font-size: 16px; font-weight: 700; padding: 6px 12px; border-radius: 999px; {{ m.avgStyle }}">{{ m.avg }}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3B404B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; transition: transform 0.3s; {{ m.chevron }}"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{ m.open }}" hint-placeholder-val="{{ false }}">
<div style="padding: 0 12px 12px 60px; display: flex; flex-direction: column; gap: 6px; animation: expand 0.3s ease-out both; {{ m.out }}">
<sc-for list="{{ m.grades }}" as="g" hint-placeholder-count="2">
<button onClick="{{ g.edit }}" aria-label="{{ g.aria }}" style="display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 40px; margin: 0 -8px; padding: 0 8px; border: none; border-radius: 12px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #2B2F38; cursor: pointer; text-align: left"><span style="flex-grow: 1; min-width: 0">{{ g.tema }}</span><span style="font-weight: 700; padding: 3px 10px; border-radius: 999px; {{ g.style }}">{{ g.nota }}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A4F5A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"></path></svg></button>
</sc-for>
<sc-if value="{{ m.noGrades }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; font-weight: 500; color: #3B404B">Todavía no cargaste notas acá</span>
</sc-if>
<button onClick="{{ m.addHere }}" style="align-self: flex-start; min-height: 36px; padding: 0 12px; margin-top: 2px; border-radius: 18px; border: 1.5px solid rgba(21,23,28,0.14); background: #FFFFFF; color: #15171C; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Cargar nota de {{ m.name }}</button>
</div>
</sc-if>
</div>
</sc-for>
</div>

</div>

<nav ref="{{ nav.ref }}" aria-label="Secciones" onPointerDown="{{ nav.down }}" onPointerMove="{{ nav.move }}" onPointerUp="{{ nav.up }}" onPointerCancel="{{ nav.cancel }}" style="position: relative; margin: 12px 14px 20px 14px; border-radius: 32px; padding: 7px; display: flex; justify-content: space-between; touch-action: none; user-select: none; -webkit-user-select: none; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.72); backdrop-filter: blur(30px) saturate(170%); -webkit-backdrop-filter: blur(30px) saturate(170%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), inset 0 -1px 1px rgba(255,255,255,0.35), 0 14px 34px rgba(30,40,80,0.16)">
<span aria-hidden="true" style="position: absolute; z-index: 0; top: 7px; bottom: 7px; left: 7px; width: calc((100% - 14px) / 5); border-radius: 25px; box-shadow: inset 0 1px 1px rgba(255,255,255,0.25), 0 6px 16px rgba(21,23,28,0.3); pointer-events: none; {{ nav.pill }}"></span>
<button onClick="{{ nav.go0 }}" style="position: relative; z-index: 1; flex: 1 1 0; min-height: 56px; border-radius: 25px; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color 0.3s; {{ nav.s0 }}">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transition: transform 0.4s cubic-bezier(.34,1.45,.64,1); {{ nav.i0 }}"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</button>
<button onClick="{{ nav.go1 }}" style="position: relative; z-index: 1; flex: 1 1 0; min-height: 56px; border-radius: 25px; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color 0.3s; {{ nav.s1 }}">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transition: transform 0.4s cubic-bezier(.34,1.45,.64,1); {{ nav.i1 }}"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Agenda</button>
<button onClick="{{ nav.go2 }}" aria-current="page" style="position: relative; z-index: 1; flex: 1 1 0; min-height: 56px; border-radius: 25px; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color 0.3s; {{ nav.s2 }}">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transition: transform 0.4s cubic-bezier(.34,1.45,.64,1); {{ nav.i2 }}"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Boletín</button>
<button onClick="{{ nav.go3 }}" style="position: relative; z-index: 1; flex: 1 1 0; min-height: 56px; border-radius: 25px; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color 0.3s; {{ nav.s3 }}">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transition: transform 0.4s cubic-bezier(.34,1.45,.64,1); {{ nav.i3 }}"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Apuntes</button>
<button onClick="{{ nav.go4 }}" style="position: relative; z-index: 1; flex: 1 1 0; min-height: 56px; border-radius: 25px; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color 0.3s; {{ nav.s4 }}">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transition: transform 0.4s cubic-bezier(.34,1.45,.64,1); {{ nav.i4 }}"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>Ideas</button>
<a href="Main.dc.html" tabindex="-1" aria-hidden="true" style="display: none"></a>
<a href="Agenda.dc.html" tabindex="-1" aria-hidden="true" style="display: none"></a>
<a href="Notas.dc.html" tabindex="-1" aria-hidden="true" style="display: none"></a>
<a href="Apuntes.dc.html" tabindex="-1" aria-hidden="true" style="display: none"></a>
<a href="Ideas.dc.html" tabindex="-1" aria-hidden="true" style="display: none"></a>
</nav>

<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; top: 44px; left: 50%; z-index: 95; width: 300px; box-sizing: border-box; padding: 12px 16px; border-radius: 20px; background: rgba(22,24,32,0.9); color: #FFFFFF; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 14px 30px rgba(20,24,40,0.3); display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; animation: toastIn 0.35s cubic-bezier(.22,1,.36,1) both; {{ toastOut }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FD6C0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span>{{ toastText }}</span>
</div>
</sc-if>

<sc-if value="{{ addOpen }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 90; animation: aiFade 0.2s ease-out both">
<button onClick="{{ closeAdd }}" aria-label="Cerrar" style="position: absolute; inset: 0; width: 100%; height: 100%; border: none; padding: 0; background: rgba(15,17,22,0.28); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: default; {{ addSheet.back }}"></button>
<div role="dialog" aria-label="{{ sheetTitle }}" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 28px 20px; border-radius: 32px 32px 0 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(30px) saturate(170%); -webkit-backdrop-filter: blur(30px) saturate(170%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 -20px 50px rgba(20,24,40,0.22); display: flex; flex-direction: column; gap: 16px; animation: edUp 0.4s cubic-bezier(.22,1,.36,1) backwards; {{ addSheet.style }}">
<div onPointerDown="{{ addSheet.down }}" onPointerMove="{{ addSheet.move }}" onPointerUp="{{ addSheet.up }}" onPointerCancel="{{ addSheet.up }}" style="display: flex; flex-direction: column; gap: 10px; margin-top: -10px; padding-top: 10px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: rgba(21,23,28,0.22)"></span>
<h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">{{ sheetTitle }}</h2>
</div>
<div role="group" aria-label="Materia" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #3B404B">Materia</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ subjectChips }}" as="sc" hint-placeholder-count="6">
<button onClick="{{ sc.pick }}" aria-pressed="{{ sc.sel }}" style="min-height: 38px; padding: 0 13px; border-radius: 19px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.25s, color 0.25s, border-color 0.25s; {{ sc.style }}">{{ sc.name }}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #3B404B">Nota</span>
<div style="position: relative; height: 200px; border-radius: 22px; background: #F2F3F7; overflow: hidden; display: flex; justify-content: flex-start; align-items: center; padding-left: 36px">
<div aria-hidden="true" style="position: absolute; left: 10px; right: 10px; top: 80px; height: 40px; border-radius: 12px; transition: background 0.3s; {{ wheelBand }}"></div>
<div onPointerDown="{{ wInt.down }}" onPointerMove="{{ wInt.move }}" onPointerUp="{{ wInt.up }}" onPointerCancel="{{ wInt.up }}" onWheel="{{ wInt.wheel }}" onKeyDown="{{ wInt.key }}" tabIndex="0" role="slider" aria-label="Nota, número entero" aria-valuetext="{{ wInt.text }}" style="position: relative; z-index: 1; width: 76px; height: 200px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; outline-offset: -3px; border-radius: 14px; -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent)">
<div style="position: absolute; left: 0; right: 0; top: 0; {{ wInt.track }}">
<sc-for list="{{ wInt.items }}" as="wv" hint-placeholder-count="6">
<div style="height: 40px; display: flex; align-items: center; justify-content: flex-end; padding: 0 6px; font-size: 27px; font-weight: 600; font-variant-numeric: tabular-nums; pointer-events: none; {{ wv.style }}">{{ wv.t }}</div>
</sc-for>
</div>
</div>
<div onPointerDown="{{ wDec.down }}" onPointerMove="{{ wDec.move }}" onPointerUp="{{ wDec.up }}" onPointerCancel="{{ wDec.up }}" onWheel="{{ wDec.wheel }}" onKeyDown="{{ wDec.key }}" tabIndex="0" role="slider" aria-label="Nota, decimal" aria-valuetext="{{ wDec.text }}" style="position: relative; z-index: 1; width: 64px; height: 200px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; outline-offset: -3px; border-radius: 14px; -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent)">
<div style="position: absolute; left: 0; right: 0; top: 0; {{ wDec.track }}">
<sc-for list="{{ wDec.items }}" as="wv" hint-placeholder-count="6">
<div style="height: 40px; display: flex; align-items: center; justify-content: flex-start; padding: 0 6px; font-size: 27px; font-weight: 600; font-variant-numeric: tabular-nums; pointer-events: none; {{ wv.style }}">{{ wv.t }}</div>
</sc-for>
</div>
</div>
<span aria-live="polite" style="position: absolute; right: 18px; top: 89px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; transition: background 0.3s, color 0.3s; {{ wheelTag }}">{{ wheelWord }}</span>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3B404B">Tema de la prueba
<input type="text" value="{{ formTema }}" onChange="{{ setTema }}" placeholder="Ej: Revolución de Mayo" style="min-height: 48px; border-radius: 16px; border: 1.5px solid rgba(21,23,28,0.14); background: #FFFFFF; padding: 0 14px; font-size: 16px; font-weight: 500; color: #15171C">
</label>

closeAdd: () => sdVals(this, 'add', () => this.setState({ addOpen: false, edit: null })).close(),
subjectChips: s.data.map((m, i) => ({
name: m.name || 'Sin nombre', sel: i === fi,
style: i === fi ? 'border: 1.5px solid ' + m.color + '; background: ' + m.color + '; color: #FFFFFF;' : 'border: 1.5px solid rgba(21,23,28,0.14); background: #FFFFFF; color: #15171C;',
pick: () => this.setState({ formIdx: i })
})),
formTema: s.formTema,
setTema: (e) => this.setState({ formTema: e.target.value }),
save: () => {
var st = this.state;
var idx = Math.min(st.formIdx, st.data.length - 1);
var tema = st.formTema.trim() || 'Prueba';
var g = { n: st.formNota, t: tema };
var data = st.data.map((m, i) => {
var gs = m.grades;
if (st.edit && i === st.edit.si) gs = (st.edit.si === idx) ? gs.map((x, k) => k === st.edit.gi ? g : x) : gs.filter((x, k) => k !== st.edit.gi);
if (i === idx && !(st.edit && st.edit.si === idx)) gs = gs.concat([g]);
return gs === m.grades ? m : Object.assign({}, m, { grades: gs });
});
sdVals(this, 'add', () => this.setState({ addOpen: false, edit: null, formTema: '' })).close();
this.setState({ data: data, open: idx, saves: st.saves + 1, toast: true, toastText: (st.edit ? 'Cambiada · ' : 'Guardada · ') + data[idx].name + ' ahora tiene ' + fmt(avgOf(data[idx].grades)) });
if (this.tt) clearTimeout(this.tt);
this.tt = setTimeout(() => exClose(this, 'toast', () => this.setState({ toast: false }), 260), 2600);
},
toast: s.toast,
toastOut: exOn(this, 'toast') ? 'animation: toastOut 0.26s ease-in forwards;' : '',
toastText: s.toastText
};
}
}
